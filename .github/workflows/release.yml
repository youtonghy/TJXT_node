name: Release

# Push a tag such as v0.1.0 to publish linux binaries, deploy.sh and
# SHA256SUMS. deploy.sh installs from these assets by default. Or run it
# manually with a version: the release tag is created on the selected commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  GOEXPERIMENT: jsonv2
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/youtonghy/TJXT_node/cmd.version=${VERSION}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" \
              -o "dist/tjxt-node-linux-${arch}" .
          done
          cp deploy.sh dist/deploy.sh
          (cd dist && sha256sum tjxt-node-linux-* deploy.sh > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* --title "$VERSION" \
            --target "$GITHUB_SHA" --generate-notes
